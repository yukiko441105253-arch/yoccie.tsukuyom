name: Discord Notification

on: [push]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # コミットメッセージと作者名を取得（空の場合のエスケープ処理付き）
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          
          # JSONデータを作成してDiscordにPOST送信
          PAYLOAD=$(jq -n \
            --arg content "🚀 **Webサイトが更新されました！**" \
            --arg title "コミット内容" \
            --arg msg "${COMMIT_MSG:-（メッセージなし）}" \
            --arg author_title "更新者" \
            --arg author "${AUTHOR:-不明}" \
            '{
              content: $content,
              embeds: [{
                title: "月詠公式サイトのアップデート",
                color: 3447003,
                fields: [
                  {name: $title, value: $msg, inline: false},
                  {name: $author_title, value: $author, inline: true}
                ]
              }]
            }')

          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK_URL"
